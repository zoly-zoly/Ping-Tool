[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-ping-tool"
version = "1.0.0"
description = "A robust, cross-platform Python CLI ping utility with real-time output streaming and statistics."
readme = "README.md"
authors = [
    { name = "Developer", email = "developer@example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
py-ping = "ping_tool.cli:main"

[tool.setuptools.packages.find]
include = ["ping_tool*"]
